<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIND — 서막</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#05050d;--panel:#0a0a18;--border:#14143a;--acc:#8b7cf8;--acc2:#e07ca0;--text:#cac8f0;--dim:#3a385e;--warn:#fbbf24;--danger:#f87171;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
.screen{display:none;width:100%;max-width:680px;padding:24px 16px;flex-direction:column;align-items:center;position:relative;z-index:1;}
.screen.active{display:flex;}

/* ── 공통 배경 ── */
#d-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;display:flex;justify-content:center;align-items:flex-start;background:#05050d;}
#bg-img{width:auto;height:75vh;max-width:90%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;display:block;margin:auto;margin-top:5vh;}
#d-vig{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:200;transition:opacity .15s;}
#day-trans{display:none;position:fixed;inset:0;z-index:300;background:#000;pointer-events:none;opacity:0;}
#crack-ov{display:none;position:fixed;inset:0;z-index:100;pointer-events:none;}
#crack-ov.on{display:block;}
#crack-ov canvas{position:absolute;inset:0;width:100%;height:100%;}
#glitch-ov{display:none;position:fixed;inset:0;z-index:150;pointer-events:none;mix-blend-mode:screen;}
#collapse-ov{display:none;position:fixed;inset:0;z-index:250;pointer-events:none;}
#collapse-ov.on{display:block;animation:collapseFlash .6s ease-out forwards;}
@keyframes collapseFlash{0%{background:rgba(255,50,50,0)}10%{background:rgba(255,50,50,0.85)}60%{background:rgba(255,50,50,0.2)}100%{background:rgba(255,50,50,0)}}
.glitch-line{position:fixed;left:0;right:0;height:3px;pointer-events:none;z-index:260;animation:glitchLine .28s ease-out forwards;}
@keyframes glitchLine{0%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(0.2)}}
@keyframes glitch{0%{text-shadow:2px 0 #e07ca0,-1px 0 #6ee7f7}50%{text-shadow:-2px 0 #e07ca0,1px 0 #6ee7f7;transform:skewX(.8deg)}100%{text-shadow:none;transform:none}}

/* ── 타이틀 ── */
#s-title{min-height:100vh;justify-content:center;align-items:center;gap:0;position:relative;overflow:hidden;}
#t-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.ptc{position:absolute;border-radius:50%;opacity:0;animation:floatP linear infinite;}
@keyframes floatP{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.5}90%{opacity:.2}100%{transform:translateY(-40px) scale(1.4);opacity:0}}
#t-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;padding:20px;}
.t-eye{font-size:3.5rem;animation:eyeP 3s ease-in-out infinite;margin-bottom:10px;}
@keyframes eyeP{0%,100%{transform:scale(1);filter:drop-shadow(0 0 16px #8b7cf8)}50%{transform:scale(1.1) rotate(3deg);filter:drop-shadow(0 0 32px #e07ca0)}}
.t-logo{font-family:'Noto Serif KR',serif;font-size:4.5rem;font-weight:700;letter-spacing:16px;
  background:linear-gradient(135deg,#8b7cf8,#b16cea,#e07ca0,#6ee7f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.t-sub{font-size:.72rem;color:var(--dim);letter-spacing:10px;text-transform:uppercase;margin-bottom:20px;}
.t-line{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);margin:12px 0;}
#t-prev-badge{font-size:.65rem;color:var(--acc);letter-spacing:2px;border:1px solid rgba(139,124,248,.3);border-radius:20px;padding:4px 14px;margin-bottom:16px;display:none;}

/* 타이틀 메뉴 */
#t-menu{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:16px;}
.tmb{padding:13px 20px;border-radius:14px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .25s;letter-spacing:1px;border:none;}
.tmb-main{background:linear-gradient(135deg,#8b7cf8,#b16cea,#e07ca0);color:#fff;box-shadow:0 0 30px rgba(139,124,248,.3);}
.tmb-main:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(139,124,248,.5);}
.tmb-sec{background:rgba(139,124,248,.08);border:1px solid rgba(139,124,248,.25);color:var(--text);}
.tmb-sec:hover{background:rgba(139,124,248,.15);border-color:var(--acc);}
.tmb-sec:disabled{opacity:.3;cursor:not-allowed;}
.tmb-sm{background:transparent;border:1px solid var(--border);color:var(--dim);font-size:.75rem;padding:9px 16px;}
.tmb-sm:hover{border-color:var(--dim);color:var(--text);}

/* ── 프롤로그 ── */
#s-prologue{background:transparent;min-height:100vh;justify-content:flex-end;padding-bottom:32px;gap:0;}
#pro-bg-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;background:rgba(5,5,13,.75);}
#pro-box{position:relative;z-index:2;width:100%;max-width:640px;background:rgba(10,10,24,.97);
  border:1px solid rgba(20,20,58,.8);border-radius:20px;padding:22px 24px;backdrop-filter:blur(16px);}
#pro-speaker{font-size:.6rem;font-weight:700;color:var(--acc);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;}
#pro-text{font-size:.92rem;line-height:2;min-height:52px;font-family:'Noto Serif KR',serif;font-weight:300;}
#pro-cursor{display:inline-block;color:var(--acc);animation:blink .7s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
#pro-next{margin-top:14px;width:100%;padding:10px;background:transparent;border:1px solid var(--border);
  border-radius:10px;color:var(--dim);font-size:.75rem;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
#pro-next:hover{border-color:var(--acc);color:var(--text);}

/* ── 귀가/휴식 화면 ── */
#s-rest{min-height:100vh;justify-content:center;align-items:center;gap:0;text-align:center;position:relative;}
#rest-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:420px;padding:24px;}
#rest-time{font-size:.65rem;color:var(--dim);letter-spacing:4px;text-transform:uppercase;}
#rest-icon{font-size:3rem;margin:4px 0;}
#rest-title{font-size:1.3rem;font-weight:700;font-family:'Noto Serif KR',serif;color:var(--text);}
#rest-body{font-size:.85rem;color:#6a6890;line-height:2;font-family:'Noto Serif KR',serif;font-weight:300;max-width:360px;}
#rest-sanity-row{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:4px;}
#rest-san-lbl{font-size:.6rem;color:var(--dim);letter-spacing:2px;text-transform:uppercase;}
#rest-sbar-bg{width:180px;height:5px;background:var(--border);border-radius:99px;overflow:hidden;}
#rest-sbar{height:100%;background:var(--acc);border-radius:99px;transition:width .9s ease,background .9s;}
#rest-btn{margin-top:10px;padding:12px 40px;border:none;border-radius:14px;background:linear-gradient(135deg,rgba(139,124,248,.3),rgba(224,124,160,.3));
  border:1px solid rgba(139,124,248,.3);color:var(--text);font-size:.85rem;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .25s;}
#rest-btn:hover{background:linear-gradient(135deg,rgba(139,124,248,.5),rgba(224,124,160,.5));transform:translateY(-2px);}

/* ── DAY 화면 ── */
#s-day{min-height:100vh;justify-content:center;align-items:center;gap:18px;text-align:center;}
#day-num{font-size:4.5rem;font-weight:900;font-family:'Noto Serif KR',serif;
  background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
#day-title{font-size:.9rem;color:var(--dim);letter-spacing:4px;text-transform:uppercase;}
#day-note{max-width:360px;font-size:.84rem;color:#6a6890;line-height:2;font-family:'Noto Serif KR',serif;}
#day-sanity-row{display:flex;flex-direction:column;align-items:center;gap:6px;}
#day-sanity-lbl{font-size:.62rem;color:var(--dim);letter-spacing:2px;text-transform:uppercase;}
#day-sbar-bg{width:200px;height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
#day-sbar{height:100%;background:var(--acc);border-radius:99px;transition:width .8s ease,background .8s;}
.btn-start{padding:12px 36px;border:none;border-radius:14px;background:linear-gradient(135deg,#8b7cf8,#b16cea,#e07ca0);
  color:#fff;font-size:.88rem;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
  box-shadow:0 0 30px rgba(139,124,248,.3);transition:all .25s;letter-spacing:1px;}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(139,124,248,.5);}

/* ── 대화 화면 ── */
#s-dialog{gap:0;min-height:100vh;justify-content:flex-end;padding-bottom:24px;}
#d-hud{display:none;position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;
  align-items:center;padding:12px 18px;background:linear-gradient(180deg,rgba(5,5,13,.92),transparent);}
#d-badge{font-size:.6rem;color:var(--acc);font-weight:700;letter-spacing:2px;text-transform:uppercase;
  background:rgba(139,124,248,.1);border:1px solid rgba(139,124,248,.25);border-radius:20px;padding:4px 12px;}
#d-day-lbl{font-size:.6rem;color:var(--dim);font-weight:700;letter-spacing:1px;}
#san-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
#san-lbl{font-size:.56rem;color:var(--dim);letter-spacing:1px;text-transform:uppercase;}
#san-bg{width:80px;height:3px;background:var(--border);border-radius:99px;overflow:hidden;}
#san-bar{height:100%;background:var(--acc);border-radius:99px;transition:width .7s,background .7s;}
#patient-note{display:none;position:fixed;top:56px;left:14px;z-index:20;
  width:162px;background:rgba(8,8,20,.88);border:1px solid rgba(139,124,248,.2);border-radius:12px;
  padding:10px 12px;backdrop-filter:blur(12px);font-family:'Noto Sans KR',sans-serif;}
#pn-name{font-size:.68rem;font-weight:700;color:var(--acc);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
#pn-lines{display:flex;flex-direction:column;gap:3px;}
.pn-row{font-size:.66rem;line-height:1.5;color:var(--dim);}
.pn-row span{color:var(--text);}
#d-box{position:relative;z-index:5;width:100%;max-width:640px;background:rgba(10,10,24,.95);
  border:1px solid rgba(20,20,58,.8);border-radius:20px;padding:20px 22px;
  backdrop-filter:blur(16px);box-shadow:0 -4px 40px rgba(139,124,248,.07);}
#d-speaker{font-size:.6rem;font-weight:700;color:var(--acc);letter-spacing:3px;text-transform:uppercase;margin-bottom:9px;}
#d-text-in{font-size:.92rem;line-height:1.9;min-height:50px;font-family:'Noto Serif KR',serif;font-weight:300;}
#d-cursor{display:inline-block;color:var(--acc);animation:blink .7s infinite;}
#d-next{margin-top:12px;width:100%;padding:10px;background:transparent;border:1px solid var(--border);
  border-radius:10px;color:var(--dim);font-size:.75rem;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
#d-next:hover{border-color:var(--acc);color:var(--text);}
#d-choices{display:none;margin-top:10px;}
.adv-label{font-size:.65rem;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
.adv-btn{display:block;width:100%;margin-bottom:7px;padding:10px 14px;background:rgba(139,124,248,.06);
  border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.82rem;
  cursor:pointer;font-family:'Noto Serif KR',serif;text-align:left;transition:all .2s;line-height:1.6;}
.adv-btn:hover{border-color:var(--acc);background:rgba(139,124,248,.12);}
.adv-btn.good{border-color:rgba(74,222,128,.4);}
.adv-btn.bad{border-color:rgba(248,113,113,.4);}
.glitch-txt{animation:glitch .12s steps(1) infinite;}

/* ── 퍼즐 ── */
#s-puzzle{gap:12px;padding-top:20px;min-height:100vh;}
#pz-top{text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;}
#pz-badge{font-size:.6rem;color:var(--acc);letter-spacing:2px;text-transform:uppercase;}
#pz-title{font-size:1.1rem;font-weight:700;}
#pz-diff{font-size:.7rem;color:var(--warn);letter-spacing:1px;}
#pz-desc{font-size:.76rem;color:var(--dim);max-width:480px;line-height:1.7;text-align:center;}
#timer-track{width:100%;height:3px;background:var(--border);border-radius:99px;overflow:hidden;}
#timer-fill{height:100%;background:var(--acc);border-radius:99px;transition:width .1s linear,background .4s;}
#pz-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px 16px;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;}
#pz-vis{width:100%;display:flex;justify-content:center;align-items:center;min-height:200px;flex-wrap:wrap;gap:8px;}
canvas.pcv{border-radius:10px;border:1px solid var(--border);max-width:100%;}
#pz-q{font-size:.88rem;font-weight:700;text-align:center;color:var(--text);font-family:'Noto Serif KR',serif;}
#pz-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.cb{padding:9px 18px;border-radius:10px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);font-size:.82rem;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.cb:hover{border-color:var(--acc);}
.cb.ok2{border-color:#4ade80;color:#4ade80;}
.cb.ng{border-color:#f87171;color:#f87171;}
#pz-fb{font-size:.8rem;text-align:center;line-height:1.8;padding:0 8px;}
#pz-fb.ok{color:#4ade80;}
#pz-fb.no{color:#f87171;}
#hint-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.hint-btn{padding:6px 18px;border:1px solid var(--border);border-radius:8px;background:transparent;
  color:var(--dim);font-size:.7rem;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.hint-btn:hover{border-color:var(--dim);color:var(--text);}
#hint-txt{font-size:.74rem;color:#9d8fe0;display:none;text-align:center;line-height:1.8;max-width:420px;}

/* ── 엔딩 갤러리 ── */
#s-gallery{min-height:100vh;justify-content:flex-start;padding-top:40px;gap:16px;}
#gal-title{font-size:1.3rem;font-weight:700;font-family:'Noto Serif KR',serif;color:var(--acc);letter-spacing:3px;}
#gal-sub{font-size:.72rem;color:var(--dim);letter-spacing:2px;}
.gal-card{width:100%;max-width:500px;border:1px solid var(--border);border-radius:16px;padding:18px 20px;background:var(--panel);display:flex;align-items:center;gap:16px;}
.gal-card.unlocked{border-color:rgba(139,124,248,.4);cursor:pointer;transition:all .2s;}
.gal-card.unlocked:hover{border-color:var(--acc);background:rgba(139,124,248,.05);}
.gal-card.locked{opacity:.35;}
.gal-icon{font-size:2.2rem;}
.gal-info{flex:1;}
.gal-tag{font-size:.58rem;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
.gal-name{font-size:.95rem;font-weight:700;font-family:'Noto Serif KR',serif;}
.gal-desc{font-size:.72rem;color:var(--dim);line-height:1.6;margin-top:4px;}
.gal-lock{font-size:.68rem;color:var(--dim);}

/* ── 엔딩 ── */
#s-end{justify-content:center;min-height:100vh;gap:18px;text-align:center;padding-top:40px;}
.e-art{font-size:4rem;}
.e-tag{font-size:.6rem;color:var(--dim);letter-spacing:3px;text-transform:uppercase;}
.e-title{font-size:1.7rem;font-weight:900;font-family:'Noto Serif KR',serif;line-height:1.3;}
.e-body{font-size:.85rem;color:#8885b0;line-height:2.1;max-width:430px;border-left:2px solid var(--acc2);padding-left:14px;text-align:left;font-family:'Noto Serif KR',serif;font-weight:300;}
.btn-re{padding:12px 36px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:.86rem;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.btn-re:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(139,124,248,.35);}
.btn-g{padding:8px 22px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--dim);font-size:.74rem;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.btn-g:hover{border-color:var(--dim);color:var(--text);}
#e-summary{width:100%;max-width:430px;}

/* ── 설정 ── */
#s-settings{min-height:100vh;justify-content:flex-start;padding-top:50px;gap:20px;}
#set-title{font-size:1.3rem;font-weight:700;font-family:'Noto Serif KR',serif;color:var(--acc);letter-spacing:3px;}
.set-row{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;
  border:1px solid var(--border);border-radius:14px;padding:16px 20px;background:var(--panel);}
.set-lbl{font-size:.85rem;color:var(--text);font-family:'Noto Sans KR',sans-serif;}
.set-sub{font-size:.68rem;color:var(--dim);margin-top:3px;}
.set-ctrl{display:flex;align-items:center;gap:10px;}
.set-btn{padding:6px 16px;border:1px solid var(--border);border-radius:8px;background:transparent;
  color:var(--dim);font-size:.75rem;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.set-btn:hover,.set-btn.active{border-color:var(--acc);color:var(--acc);}
.set-danger{border-color:rgba(248,113,113,.3)!important;color:#f87171!important;}
.set-danger:hover{background:rgba(248,113,113,.08)!important;}
</style>
</head>
<body>

<!-- 공통 배경 레이어 -->
<div id="d-bg"><img id="bg-img" src="" alt=""></div>
<div id="d-vig"></div>
<div id="flash"></div>
<div id="day-trans"></div>
<div id="crack-ov"><canvas id="crack-cv"></canvas></div>
<div id="glitch-ov"></div>
<div id="collapse-ov"></div>

<!-- ══ 타이틀 ══ -->
<div id="s-title" class="screen active">
  <div id="t-particles"></div>
  <div id="t-inner">
    <div class="t-eye" id="t-eye">&#128065;</div>
    <div class="t-logo">MIND</div>
    <div class="t-sub">서 &nbsp; 막</div>
    <div class="t-line"></div>
    <div id="t-prev-badge"></div>
    <div id="t-menu">
      <button class="tmb tmb-sec" id="btn-continue" onclick="continueGame()" disabled>&#9654;&nbsp; 이어하기</button>
      <button class="tmb tmb-main" onclick="startNewGame()">&#10022;&nbsp; 새 게임</button>
      <button class="tmb tmb-sec" onclick="showGallery()">&#9670;&nbsp; 엔딩 보기</button>
      <button class="tmb tmb-sec" onclick="showSettings()">&#9881;&nbsp; 설정</button>
      <button class="tmb tmb-sm" id="btn-reset" onclick="resetSave()" style="display:none;">&#8635; 저장 초기화</button>
    </div>
  </div>
</div>


<!-- ══ 설정 ══ -->
<div id="s-settings" class="screen">
  <div id="set-title">설 &nbsp; 정</div>
  <div class="set-row">
    <div><div class="set-lbl">텍스트 속도</div><div class="set-sub">타이핑 속도를 조절합니다</div></div>
    <div class="set-ctrl">
      <button class="set-btn" id="spd-slow" onclick="setTextSpeed('slow')">느리게</button>
      <button class="set-btn active" id="spd-normal" onclick="setTextSpeed('normal')">보통</button>
      <button class="set-btn" id="spd-fast" onclick="setTextSpeed('fast')">빠르게</button>
    </div>
  </div>
  <div class="set-row">
    <div><div class="set-lbl">저장 데이터 초기화</div><div class="set-sub">엔딩 기록과 이전 회차 기억이 삭제됩니다</div></div>
    <button class="set-btn set-danger" onclick="resetSave()">초기화</button>
  </div>
  <div class="set-row">
    <div><div class="set-lbl">버전</div><div class="set-sub">MIND — 서막</div></div>
    <span style="font-size:.72rem;color:var(--dim);">v6.0</span>
  </div>
  <button class="btn-g" onclick="show('s-title')" style="margin-top:8px;">&#9664; 돌아가기</button>
</div>

<!-- ══ 프롤로그 ══ -->
<div id="s-prologue" class="screen">
  <div id="pro-bg-overlay"></div>
  <div id="pro-box">
    <div id="pro-speaker">나</div>

var bgBreak=false;
function getBgState(dIdx,forceBreak){
  if(forceBreak||bgBreak)return 5;
  if(dIdx<=1)return 0;if(dIdx===2)return 1;if(dIdx===3)return 2;
  if(dIdx===4)return 3;if(dIdx===5)return 4;return 4;
}
function drawBg(dIdx,forceBreak){
  var img=document.getElementById('bg-img');
  if(img)img.src=BG_FRAMES[getBgState(dIdx,forceBreak)];
}
window.addEventListener('resize',function(){drawBg(dayIdx,bgBreak);});

var saveData={
  prevEnding:null,      // 마지막 엔딩 key
  textSpeed:'normal',   // 텍스트 속도
  unlockedEndings:[],   // 해금된 엔딩들
  hasProgress:false,    // 이어하기 가능 여부
  // 이어하기용 스냅샷
  snap:null
};

function loadSave(){
  try{
    var s=localStorage.getItem('mind_save');
    if(s)saveData=JSON.parse(s);
    prevEnding=saveData.prevEnding||null;
  }catch(e){}
}
function writeSave(){
  try{localStorage.setItem('mind_save',JSON.stringify(saveData));}catch(e){}
}
function saveProgress(){
  saveData.hasProgress=true;
  saveData.snap={dayIdx:dayIdx,patientIdx:patientIdx,sanity:sanity,endScore:endScore,wrongTotal:wrongTotal,bgBreak:bgBreak};
  writeSave();
}
function clearProgress(){
  saveData.hasProgress=false;saveData.snap=null;writeSave();
}
function unlockEnding(key){
  if(saveData.unlockedEndings.indexOf(key)===-1){
    saveData.unlockedEndings.push(key);
  }
  saveData.prevEnding=key;
  prevEnding=key;
  writeSave();
}
function resetSave(){
  if(confirm('정말 모든 저장 데이터를 초기화할까요?')){
    try{localStorage.removeItem('mind_save');}catch(e){}
    saveData={prevEnding:null,unlockedEndings:[],hasProgress:false,snap:null};
    prevEnding=null;
    location.reload();
  }
}

// ── 산정력 ──
function setSanity(v){
  sanity=Math.max(0,Math.min(100,v));
  ['san-bar','day-sbar','rest-sbar'].forEach(function(id){
    var el=document.getElementById(id);if(!el)return;
    el.style.width=sanity+'%';
    el.style.background=sanity>60?'#8b7cf8':sanity>30?'#fbbf24':'#f87171';
  });
  if(sanity<35)showCrack();
}
function loseSanity(n){setSanity(sanity-n);}
function gainSanity(n){setSanity(Math.min(100,sanity+n));}

function showCrack(){
  var ov=document.getElementById('crack-ov');
  var cv2=document.getElementById('crack-cv');
  cv2.width=window.innerWidth;cv2.height=window.innerHeight;
  var c=cv2.getContext('2d');c.clearRect(0,0,cv2.width,cv2.height);
  var n=4+Math.floor((100-sanity)/10);
  for(var i=0;i<n;i++){
    c.strokeStyle='rgba(224,124,160,'+(0.1+Math.random()*0.2)+')';
    c.lineWidth=0.5+Math.random()*1.5;c.beginPath();
    var x=Math.random()*cv2.width,y=Math.random()*cv2.height;
    c.moveTo(x,y);
    for(var j=0;j<8;j++){x+=(-80+Math.random()*160);y+=(-80+Math.random()*160);c.lineTo(x,y);}
    c.stroke();
  }
  ov.classList.add('on');
  clearTimeout(crackTmr);
  crackTmr=setTimeout(function(){ov.classList.remove('on');},500);
}

// 7일차 김하은 collapse 시 극적인 배경 전환
function flashScreen(){
  // 1) 빨간 번쩍
  var cov=document.getElementById('collapse-ov');
  cov.classList.remove('on');
  void cov.offsetWidth; // reflow
  cov.classList.add('on');

  // 2) 글리치 라인 여러 개
  spawnGlitchLines();

  // 3) 화면 흔들림
  document.body.style.transition='transform .05s';
  var shakes=[[4,0],[-4,2],[3,-2],[-2,1],[0,0]];
  var si=0;
  var shakeInt=setInterval(function(){
    if(si>=shakes.length){clearInterval(shakeInt);document.body.style.transform='';return;}
    document.body.style.transform='translate('+shakes[si][0]+'px,'+shakes[si][1]+'px)';
    si++;
  },55);

  // 4) 배경 이미지 교체 + 페이드
  setTimeout(function(){
    var img=document.getElementById('bg-img');
    img.style.transition='opacity .3s, filter .5s';
    img.style.filter='invert(1) hue-rotate(180deg) contrast(2)';
    setTimeout(function(){
      img.src=BG_FRAMES[5]; // 붕괴 프레임
      img.style.filter='saturate(0.3) brightness(0.6)';
      img.style.transition='filter 1.2s';
    },300);
  },200);

  // 5) 2초 후 글리치 사운드 효과 (AudioContext)
  try{
    var ac=new AudioContext();
    var buf=ac.createBuffer(1,ac.sampleRate*0.15,ac.sampleRate);
    var d=buf.getChannelData(0);
    for(var k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*(1-k/d.length);
    var src2=ac.createBufferSource();src2.buffer=buf;
    var g=ac.createGain();g.gain.value=0.08;
    src2.connect(g);g.connect(ac.destination);src2.start();
  }catch(e){}
}

function spawnGlitchLines(){
  var n=8+Math.floor(Math.random()*6);
  for(var i=0;i<n;i++){
    (function(delay){
      setTimeout(function(){
        var line=document.createElement('div');
        line.className='glitch-line';
        line.style.top=Math.random()*100+'vh';
        var hue=Math.random()>0.5?'rgba(255,50,80,':'rgba(80,200,255,';
        line.style.background=hue+'0.7)';
        line.style.boxShadow='0 0 8px '+hue+'0.5)';
        document.body.appendChild(line);
        setTimeout(function(){if(line.parentNode)line.parentNode.removeChild(line);},350);
      },delay);
    })(i*30+Math.random()*60);
  }
}

function renderDialog(){
  var day=DAYS[dayIdx];
  var pat=day.patients[patientIdx];
  var lines=dMode==='pre'?pat.pre:pat.post;
  if(dIdx>=lines.length){
    if(dMode==='pre'){startPuzzle();}
    else{
      var isLast=(dayIdx===DAYS.length-1&&patientIdx===day.patients.length-1);
      if(isLast){calcEnding();return;}
      nextPatient();
    }
    return;
  }
  var line=lines[dIdx];
  var choicesEl=document.getElementById('d-choices');
  var nextBtn=document.getElementById('d-next');
  if(line.advices){
    choicesEl.style.display='block';choicesEl.innerHTML='';
    var lbl=document.createElement('div');lbl.className='adv-label';lbl.textContent='어떤 조언을 할까요?';
    choicesEl.appendChild(lbl);
    line.advices.forEach(function(adv,i){
      var btn=document.createElement('button');btn.className='adv-btn';
      btn.innerHTML=(i===0?'[A] ':(i===1?'[B] ':'[C] '))+adv.tx;
      btn.onclick=function(){selectAdvice(adv,line.advices);};
      choicesEl.appendChild(btn);
    });
    document.getElementById('d-speaker').textContent='치료사';
    document.getElementById('d-text-inner').textContent='...';
    nextBtn.style.display='none';return;
  }
  choicesEl.style.display='none';nextBtn.style.display='block';
  var sp=line.sp||'';
  document.getElementById('d-speaker').textContent=sp;
  var spColor={'치료사':'#8b7cf8','내레이션':'#6a6890','기록지':'#fbbf24','김하은':'#f87171'};
  document.getElementById('d-speaker').style.color=spColor[sp]||'#8b7cf8';
  var txtEl=document.getElementById('d-text-inner');
  var curEl=document.getElementById('d-cursor');
  nextBtn.style.display='none';
  typeText(txtEl,line.tx,function(){
    nextBtn.style.display='block';
    if(sp==='내레이션'||sp==='기록지'){
      document.getElementById('d-text-in').style.fontStyle='italic';
    } else {
      document.getElementById('d-text-in').style.fontStyle='normal';
    }
  });
  if(line.collapse&&!bgBreak){
    bgBreak=true;
    setTimeout(function(){drawBg(dayIdx,true);flashScreen();},400);
  }
}

function selectAdvice(adv,allAdvices){
  var choicesEl=document.getElementById('d-choices');
  var nextBtn=document.getElementById('d-next');
  var btns=choicesEl.querySelectorAll('.adv-btn');
  btns.forEach(function(btn,i){
    btn.disabled=true;
    btn.className='adv-btn '+(allAdvices[i]===adv?(adv.end==='deny'?'good':adv.end==='collapse'?'bad':''):'');
    btn.onclick=null;
    btn.style.opacity=(allAdvices[i]===adv)?'1':'0.3';
  });
  if(!window._adviceLog)window._adviceLog=[];
  window._adviceLog.push(adv.end);
  if(adv.end==='deny')endScore+=1;
  else if(adv.end==='collapse')endScore-=1;
  var resp=document.createElement('div');
  resp.style.cssText='margin-top:10px;padding:10px 12px;background:rgba(255,255,255,.04);border-left:2px solid '+(adv.end==='deny'?'#4ade80':adv.end==='collapse'?'#f87171':'#a78bfa')+';border-radius:0 8px 8px 0;font-size:.82rem;color:var(--text);font-family:"Noto Serif KR",serif;line-height:1.7;';
  resp.textContent=adv.resp;
  choicesEl.appendChild(resp);
  setTimeout(function(){nextBtn.style.display='block';},400);
}

function nextDialog(){
  if(typing){clearInterval(typeInt);document.getElementById('d-text-inner').textContent=fullTxt;typing=false;return;}
  dIdx++;renderDialog();
}

function nextPatient(){
  patientIdx++;
  var day=DAYS[dayIdx];
  if(patientIdx>=day.patients.length){
    // 하루 끝 → 귀가 화면
    dayIdx++;
    if(dayIdx>=DAYS.length){calcEnding();return;}
    var restIdx=dayIdx-1; // REST_SCENES[0]=null(Day1끝), [1]=Day2끝 등
    showRestScreen(restIdx,function(){
      showDayScreen();
    });
  } else {
    beginPatient();
  }
}

function beginPatient(){
  var day=DAYS[dayIdx];
  var pat=day.patients[patientIdx];
  dIdx=0;dMode='pre';

  // 회차 기억 — Day1 첫 환자 대화 변형
  if(dayIdx===0&&patientIdx===0&&prevEnding){
    pat=JSON.parse(JSON.stringify(pat));
    if(prevEnding==='deny'){
      pat.pre=[

        {sp:"최민서",tx:"선생님? 괜찮으세요?"},
        {sp:"치료사",tx:"색채 감정 투사예요. 오늘 테스트를 해볼게요."}

      ];
    } else if(prevEnding==='collapse'){
      pat.pre=[
        {sp:"기록지",tx:"환자 최민서, 27세. — 이 글씨가 흔들린다."},
        {sp:"치료사",tx:"(방이... 작다. 오늘따라 유난히 작다.)"},
        {sp:"최민서",tx:"선생님, 남자친구 얼굴이 화날 때는 빨갛게, 웃을 때는 회색으로 보여요."},

    pat=JSON.parse(JSON.stringify(pat));
    if(prevEnding==='deny'){
      pat.pre.splice(1,0,{sp:"김하은",tx:"지난번처럼 또 부정하실 건가요?"});

  }

  updatePatientNote(pat);
  document.getElementById('d-badge').textContent=pat.badge||pat.name;

  drawBg(dayIdx,bgBreak);
  show('s-dialog');
  renderDialog();
}

    // 오른쪽 얼굴: "환자처럼 보이는" — 눈이 약간 다르고 표정 반전
    svg.appendChild(drawFaceSVG(270,120,62,true,true,'#ddd6fe','#1a0a2e'));

    // 물음표 오버레이 — 두 얼굴 위에 흐릿하게 겹쳐진 동일한 실루엣 암시
    var ov=mk('text',{x:'180',y:'138',fill:'rgba(139,124,248,0.07)','font-size':'120','font-family':'serif','text-anchor':'middle','font-weight':'700'});
    ov.textContent='?';svg.appendChild(ov);

    // 하단 설명
    var desc=mk('text',{x:'180',y:'234',fill:'#2a2850','font-size':'10','font-family':'sans-serif','text-anchor':'middle'});
    desc.textContent='두 얼굴은 같은 얼굴입니다';svg.appendChild(desc);

    // CSS 애니메이션으로 두 얼굴 색이 서서히 교환되는 효과
    var style=document.createElement('style');
    style.textContent='@keyframes faceSwap{0%,100%{opacity:1}50%{opacity:0.4}}';

    svg.querySelectorAll('g')[1].style.animation='faceSwap 3s ease-in-out infinite reverse';

  }
}

function drawSnakeRings(c,cx,cy,r){

      c.save();c.translate(px,py);c.rotate(a+(ring%2===0?Math.PI/4:-Math.PI/4));
      c.fillStyle=i%2===0?'#1a1a32':'#b8b4e0';

  }
}

function drawChecker(c,ox,oy,w,h){
  // Adelson 체커 그림자 착시
  // A칸(그림자 속 어두운 칸)과 B칸(밝은 곳 밝은 칸)이 실제론 같은 색
  var cols=8, rows=8;
  var sz=Math.floor(Math.min(w,h)/8);
  var startX=ox+(w-sz*cols)/2, startY=oy+(h-sz*rows)/2;

  // 1) 체커보드 — 연보라/짙은 남색
  for(var r=0;r<rows;r++){
    for(var cc=0;cc<cols;cc++){
      var light=(r+cc)%2===0;
      c.fillStyle=light?'#b8b4d8':'#1e1c38';
      c.fillRect(startX+cc*sz,startY+r*sz,sz,sz);
    }
  }

  // 2) 원통 — 중앙 오른쪽 위에
  var cylX=startX+sz*4.5, cylY=startY+sz*1.5, cylR=sz*0.9, cylH=sz*3.5;
  // 원통 그림자 (우하 방향으로 길게)
  var shg=c.createRadialGradient(cylX+sz*0.3,cylY+cylH+sz*1.2,sz*0.1,
                                  cylX,cylY+cylH+sz*0.8,sz*2.5);
  shg.addColorStop(0,'rgba(0,0,20,0.78)');
  shg.addColorStop(0.4,'rgba(0,0,20,0.45)');
  shg.addColorStop(1,'rgba(0,0,20,0)');
  c.fillStyle=shg;
  c.beginPath();
  c.ellipse(cylX+sz*0.2,cylY+cylH+sz*1,cylR*2.4,cylR*0.7,-0.18,0,Math.PI*2);
  c.fill();

  // 원통 몸체 (그라데이션)
  var cg=c.createLinearGradient(cylX-cylR,cylY,cylX+cylR,cylY);
  cg.addColorStop(0,'#2a2848');cg.addColorStop(0.35,'#7c78b8');
  cg.addColorStop(0.65,'#9490cc');cg.addColorStop(1,'#1a183a');
  c.fillStyle=cg;
  c.fillRect(cylX-cylR,cylY,cylR*2,cylH);
  // 윗 타원 (밝음)
  c.fillStyle='#a8a4d0';
  c.beginPath();c.ellipse(cylX,cylY,cylR,cylR*0.32,0,0,Math.PI*2);c.fill();
  // 아래 타원 (어두움)
  c.fillStyle='#4a4878';
  c.beginPath();c.ellipse(cylX,cylY+cylH,cylR,cylR*0.32,0,0,Math.PI);c.fill();

  // 3) A칸, B칸 선택 — 같은 회색값이지만 다르게 보임
  // A = 그림자 속 어두운(흑) 칸 → 실제 색 약 #787878
  // B = 그림자 밖 밝은(백) 칸 → 실제 색도 약 #787878
  // 하지만 실제 구현에서는 그냥 라벨로 표시하고, 체커의 착시를 설명
  var Acol=4, Arow=4; // 그림자 속 어두운 칸
  var Bcol=6, Brow=2; // 그림자 밖 밝은 칸
  var Ax2=startX+Acol*sz, Ay2=startY+Arow*sz;
  var Bx2=startX+Bcol*sz, By2=startY+Brow*sz;

  // A와 B 사이 이음선 (같은 색임을 암시)
  c.strokeStyle='rgba(248,113,113,0.5)';c.lineWidth=1;c.setLineDash([3,3]);
  c.beginPath();c.moveTo(Ax2+sz/2,Ay2+sz/2);c.lineTo(Bx2+sz/2,By2+sz/2);c.stroke();
  c.setLineDash([]);

  // A 라벨 (그림자 속)
  c.strokeStyle='#f87171';c.lineWidth=2.5;c.strokeRect(Ax2+1,Ay2+1,sz-2,sz-2);
  c.fillStyle='#f87171';c.font='bold '+(sz*0.6)+'px sans-serif';c.textAlign='center';
  c.fillText('A',Ax2+sz/2,Ay2+sz/2+sz*0.22);

  // B 라벨 (밝은 곳)
  c.strokeStyle='#34d399';c.lineWidth=2.5;c.strokeRect(Bx2+1,By2+1,sz-2,sz-2);
  c.fillStyle='#34d399';
  c.fillText('B',Bx2+sz/2,By2+sz/2+sz*0.22);
}
function drawRubin(c,cx,cy,h){
  var W=c.canvas.width, H=c.canvas.height;
  var vw=h*0.52; // 꽃병 반폭
  var top=cy-h, bot=cy+h;

  // 1) 배경 전체를 검정으로 (얼굴 색)
  c.fillStyle='#0d0b1e';
  c.fillRect(0,0,W,H);

  // 2) 얼굴 윤곽 클리핑: 왼쪽 얼굴 = 꽃병 왼쪽 공간
  // 왼쪽 얼굴 실루엣 (오른쪽 경계 = 꽃병 왼쪽 곡선)
  c.save();
  c.beginPath();
  // 왼쪽 얼굴: 왼쪽 경계(직선)부터 꽃병 왼쪽 곡선까지
  c.moveTo(cx-vw*2.8, top-4);
  c.lineTo(cx-vw*2.8, bot+4);
  c.lineTo(cx-vw, bot);  // 꽃병 바닥 왼쪽
  // 꽃병 왼쪽 곡선 (아래→위)
  c.bezierCurveTo(cx-vw*1.5, cy+h*0.3, cx-vw*1.3, cy-h*0.3, cx-vw*0.7, top+h*0.35);
  c.bezierCurveTo(cx-vw*0.3, top+h*0.05, cx-vw*0.1, top, cx, top);
  c.lineTo(cx, top-4);
  c.lineTo(cx-vw*2.8, top-4);
  c.closePath();
  c.fillStyle='#c4b5fd';
  c.fill();
  c.restore();

  // 3) 오른쪽 얼굴 (꽃병 오른쪽 공간)
  c.save();
  c.beginPath();
  c.moveTo(cx+vw*2.8, top-4);
  c.lineTo(cx, top-4);
  c.lineTo(cx, top);
  // 꽃병 오른쪽 곡선 (위→아래)
  c.bezierCurveTo(cx+vw*0.1, top, cx+vw*0.3, top+h*0.05, cx+vw*0.7, top+h*0.35);
  c.bezierCurveTo(cx+vw*1.3, cy-h*0.3, cx+vw*1.5, cy+h*0.3, cx+vw, bot);
  c.lineTo(cx+vw*2.8, bot+4);
  c.lineTo(cx+vw*2.8, top-4);
  c.closePath();
  c.fillStyle='#c4b5fd';
  c.fill();
  c.restore();

  // 4) 가운데 꽃병 (밝은 색, 얼굴 위에 그림)
  c.beginPath();
  c.moveTo(cx, top);
  // 오른쪽 곡선 (위→아래)
  c.bezierCurveTo(cx+vw*0.1, top, cx+vw*0.3, top+h*0.05, cx+vw*0.7, top+h*0.35);
  c.bezierCurveTo(cx+vw*1.3, cy-h*0.3, cx+vw*1.5, cy+h*0.3, cx+vw, bot);
  // 바닥
  c.lineTo(cx-vw, bot);
  // 왼쪽 곡선 (아래→위)
  c.bezierCurveTo(cx-vw*1.5, cy+h*0.3, cx-vw*1.3, cy-h*0.3, cx-vw*0.7, top+h*0.35);
  c.bezierCurveTo(cx-vw*0.3, top+h*0.05, cx-vw*0.1, top, cx, top);
  c.closePath();
  c.fillStyle='#ede9fe';
  c.fill();

  // 5) 꽃병 안 음영 (입체감)
  var grad=c.createLinearGradient(cx-vw,cy,cx+vw,cy);
  grad.addColorStop(0,'rgba(100,80,180,0.35)');
  grad.addColorStop(0.5,'rgba(255,255,255,0.08)');
  grad.addColorStop(1,'rgba(100,80,180,0.35)');
  c.fillStyle=grad;
  c.beginPath();
  c.moveTo(cx, top);
  c.bezierCurveTo(cx+vw*0.1, top, cx+vw*0.3, top+h*0.05, cx+vw*0.7, top+h*0.35);
  c.bezierCurveTo(cx+vw*1.3, cy-h*0.3, cx+vw*1.5, cy+h*0.3, cx+vw, bot);
  c.lineTo(cx-vw, bot);
  c.bezierCurveTo(cx-vw*1.5, cy+h*0.3, cx-vw*1.3, cy-h*0.3, cx-vw*0.7, top+h*0.35);
  c.bezierCurveTo(cx-vw*0.3, top+h*0.05, cx-vw*0.1, top, cx, top);
  c.closePath();
  c.fill();

  // 6) 얼굴 이목구비 힌트 (코, 입 곡선으로 얼굴임을 암시)
  c.strokeStyle='rgba(30,20,60,0.5)'; c.lineWidth=1.2;
  // 왼쪽 얼굴 눈, 코 (왼쪽에 미러)
  var ex=cx-vw*1.7, ey=cy-h*0.18;
  c.beginPath(); c.arc(ex, ey, h*0.06, 0, Math.PI*2); c.fillStyle='rgba(30,20,60,0.4)'; c.fill();
  // 오른쪽 얼굴 눈
  c.beginPath(); c.arc(cx+vw*1.7, ey, h*0.06, 0, Math.PI*2); c.fill();

  c.fillStyle='rgba(196,181,253,0.65)';
  c.font='bold 12px monospace'; c.textAlign='center';
  c.fillText('꽃병? 얼굴?', cx, bot+20);
}
function drawFraser(c,cx,cy,r){
  // 프레이저 나선: 실제로는 동심원이지만 나선처럼 보임
  // 비결: 각 원의 작은 선분에 사선 패턴을 교대로 넣으면 원이 나선으로 보임
  var numRings=6;
  var segW=10; // 각 선분의 각도 너비(도)

  for(var ring=1;ring<=numRings;ring++){
    var rr=r*ring/numRings;
    var thick=r/(numRings*1.4);
    var totalSegs=Math.round(2*Math.PI*rr/segW);
    if(totalSegs<12)totalSegs=12;

    for(var s=0;s<totalSegs;s++){
      var a1=s/totalSegs*Math.PI*2;
      var a2=(s+1)/totalSegs*Math.PI*2;
      var aMid=(a1+a2)/2;

      // 선분의 중심점
      var mx=cx+Math.cos(aMid)*rr, my=cy+Math.sin(aMid)*rr;

      // 사선 방향: 홀수/짝수 링에 따라 반대 방향으로 기울임
      // 이 기울기가 나선 착시를 만드는 핵심
      var tilt=(ring%2===0?1:-1)*0.45;
      var tiltAngle=aMid+Math.PI/2+tilt;

      // 체크 패턴 (흑백 교대)
      var isLight=(s+ring)%2===0;
      c.fillStyle=isLight?'#ddd6fe':'#1a1838';

      // 호 그리기
      c.beginPath();
      c.arc(cx,cy,rr+thick/2,a1,a2);
      c.arc(cx,cy,rr-thick/2,a2,a1,true);
      c.closePath();
      c.fill();

      // 사선 힌트 추가
      if(!isLight){
        c.save();
        c.beginPath();c.arc(cx,cy,rr+thick/2,a1,a2);
        c.arc(cx,cy,rr-thick/2,a2,a1,true);
        c.closePath();c.clip();

        c.strokeStyle='rgba(30,25,60,0.6)';c.lineWidth=1.5;
        var hatchN=3;
        for(var hi=0;hi<hatchN;hi++){
          var ha=a1+(a2-a1)*(hi+0.5)/hatchN;
          var hx=cx+Math.cos(ha)*rr, hy=cy+Math.sin(ha)*rr;
          c.beginPath();
          c.moveTo(hx-Math.cos(tiltAngle)*thick,hy-Math.sin(tiltAngle)*thick);
          c.lineTo(hx+Math.cos(tiltAngle)*thick,hy+Math.sin(tiltAngle)*thick);
          c.stroke();
        }
        c.restore();
      }
    }
  }
  // 중심
  c.beginPath();c.arc(cx,cy,r/numRings*0.6,0,Math.PI*2);
  c.fillStyle='#c4b5fd';c.fill();
}
function drawScintillating(c,W,H){
  var gap=44,dot=4,ox=20,oy=20;
  c.fillStyle='#181830';c.fillRect(0,0,W,H);
  var rows=Math.floor((H-oy*2)/gap)+1;
  var cols2=Math.floor((W-ox*2)/gap)+1;
  for(var r=0;r<rows;r++){
    for(var cc=0;cc<cols2;cc++){
      var x=ox+cc*gap,y=oy+r*gap;
      c.fillStyle='#a0a0c8';
      c.fillRect(x-dot,y-dot,dot*2,dot*2);
    }
  }
  for(var r=0;r<rows-1;r++){
    for(var cc=0;cc<cols2-1;cc++){
      var x=ox+cc*gap+gap/2,y=oy+r*gap+gap/2;
      c.fillStyle='#e8e4ff';
      c.fillRect(x-18,y-18,36,36);
    }
  }
  c.fillStyle='#3a385e';c.font='11px sans-serif';c.textAlign='center';
  c.fillText('교차점을 직접 보면 점이 사라집니다',W/2,H-8);
}
function drawNecker(c,cx,cy,s){
  // 네커 큐브: 투명한 정육면체의 등각투영
  // 앞면이 좌하인지 우상인지 인식이 번갈아 바뀜
  var d=s*0.55; // 큐브 반크기
  var ox=s*0.28, oy=s*0.16; // 등각투영 offset

  // 8개 꼭짓점 (front face 4개, back face 4개)
  // front face (뷰어 쪽): 좌상, 우상, 우하, 좌하
  var f=[[cx-d,cy-d],[cx+d,cy-d],[cx+d,cy+d],[cx-d,cy+d]];
  // back face: front face를 (ox, -oy) 이동
  var b=[[cx-d+ox,cy-d-oy],[cx+d+ox,cy-d-oy],[cx+d+ox,cy+d-oy],[cx-d+ox,cy+d-oy]];

  function line(p1,p2,col,lw,dash){
    c.save();
    if(dash)c.setLineDash(dash);
    c.beginPath();c.moveTo(p1[0],p1[1]);c.lineTo(p2[0],p2[1]);
    c.strokeStyle=col;c.lineWidth=lw;c.stroke();
    c.restore();
  }
  function dot(p,col,r){
    c.beginPath();c.arc(p[0],p[1],r,0,Math.PI*2);
    c.fillStyle=col;c.fill();
  }

  var LC='#a78bfa', BC='rgba(167,139,250,0.35)'; // 앞선/뒷선 색

  // 뒷면 (점선)
  line(b[0],b[1],BC,1.5,[5,3]);
  line(b[1],b[2],BC,1.5,[5,3]);
  line(b[2],b[3],BC,1.5,[5,3]);
  line(b[3],b[0],BC,1.5,[5,3]);

  // 뒷면→앞면 연결선 (점선)
  line(b[0],f[0],BC,1.5,[5,3]);
  line(b[1],f[1],BC,1.5,[5,3]);
  line(b[2],f[2],BC,1.5,[5,3]);
  line(b[3],f[3],BC,1.5,[5,3]);

  // 앞면 (실선)
  line(f[0],f[1],LC,2);
  line(f[1],f[2],LC,2);
  line(f[2],f[3],LC,2);
  line(f[3],f[0],LC,2);

  // 꼭짓점 강조
  f.forEach(function(p){dot(p,'#c4b5fd',3);});
  b.forEach(function(p){dot(p,'rgba(167,139,250,0.5)',2);});

  // 모호성 힌트: 두 면에 라벨
  c.fillStyle='rgba(244,114,182,0.7)';c.font='bold 10px monospace';c.textAlign='center';
  c.fillText('앞?',(f[0][0]+f[2][0])/2,(f[0][1]+f[2][1])/2);
  c.fillStyle='rgba(96,165,250,0.7)';
  c.fillText('앞?',(b[0][0]+b[2][0])/2,(b[0][1]+b[2][1])/2);

  c.fillStyle='rgba(90,88,112,0.8)';c.font='11px sans-serif';c.textAlign='center';
  c.fillText('어느 면이 앞쪽인가요?',cx,cy+s+16);
}
function drawPenrose(c,cx,cy,s){
  // ═══ 펜로즈 불가능 삼각형 — 완전 재구현 ═══
  // 참고: 실제 펜로즈 삼각형은 각 꼭짓점에서 빔의 앞뒤가 뒤바뀌어
  // 전체적으로는 불가능하지만 국소적으로는 말이 되는 구조
  var k=s/100;
  var R=80*k, T=18*k;
  var h=Math.sqrt(3)/2;

  // 정삼각형 꼭짓점 (A=상단, B=좌하, C=우하)
  var Ax=cx,         Ay=cy-R;
  var Bx=cx-R*h,     By=cy+R/2;
  var Cx=cx+R*h,     Cy=cy+R/2;

  function unit(x1,y1,x2,y2){
    var l=Math.hypot(x2-x1,y2-y1);
    return[(x2-x1)/l,(y2-y1)/l];
  }
  function np(d){return[-d[1],d[0]];} // 왼쪽 수직
  function pt(x,y,n,t){return[x+n[0]*t,y+n[1]*t];}
  function quad(p0,p1,p2,p3,col){
    c.beginPath();
    c.moveTo(p0[0],p0[1]);c.lineTo(p1[0],p1[1]);
    c.lineTo(p2[0],p2[1]);c.lineTo(p3[0],p3[1]);
    c.closePath();c.fillStyle=col;c.fill();
  }
  function tri(p0,p1,p2,col){
    c.beginPath();
    c.moveTo(p0[0],p0[1]);c.lineTo(p1[0],p1[1]);c.lineTo(p2[0],p2[1]);
    c.closePath();c.fillStyle=col;c.fill();
  }
  function edge(p0,p1,col,w){
    c.beginPath();c.moveTo(p0[0],p0[1]);c.lineTo(p1[0],p1[1]);
    c.strokeStyle=col;c.lineWidth=w;c.stroke();
  }

  // 각 빔의 방향 벡터와 두께 방향 벡터
  var dAB=unit(Ax,Ay,Bx,By), nAB=np(dAB); // A→B: 왼쪽 빔
  var dBC=unit(Bx,By,Cx,Cy), nBC=np(dBC); // B→C: 아래 빔
  var dCA=unit(Cx,Cy,Ax,Ay), nCA=np(dCA); // C→A: 오른쪽 빔

  // 빔의 4개 꼭짓점 (outer=바깥, inner=삼각형 안쪽)
  // AB 빔: outer가 왼쪽, inner가 오른쪽
  var Ao=pt(Ax,Ay,nAB,T), Bo_ab=pt(Bx,By,nAB,T);   // outer edge
  var Ai=pt(Ax,Ay,nAB,-T), Bi_ab=pt(Bx,By,nAB,-T); // inner edge

  // BC 빔: outer가 아래쪽
  var Bo_bc=pt(Bx,By,nBC,T), Co_bc=pt(Cx,Cy,nBC,T);
  var Bi_bc=pt(Bx,By,nBC,-T), Ci_bc=pt(Cx,Cy,nBC,-T);

  // CA 빔: outer가 오른쪽
  var Co_ca=pt(Cx,Cy,nCA,T), Ao_ca=pt(Ax,Ay,nCA,T);
  var Ci_ca=pt(Cx,Cy,nCA,-T), Ai_ca=pt(Ax,Ay,nCA,-T);

  // 색상: 위면(밝음), 왼면(중간), 오른/아래면(어두움)
  var L='#e2d9f3', M='#7c3aed', D='#1a0a3a';
  var E='rgba(255,255,255,0.5)';

  // ── 1. 세 빔의 기본 면 그리기 ──
  // AB 빔(왼쪽): 앞면=밝음, 바깥면=어두움
  quad(Ao, Bo_ab, Bi_ab, Ai, L);                     // 앞면(두께면, 밝음)
  quad([Ax,Ay],[Bx,By],Bo_ab,Ao, D);                 // 왼쪽 외곽면(어두움)

  // BC 빔(아래): 아랫면=중간, 외곽=어두움
  quad(Bo_bc, Co_bc, Ci_bc, Bi_bc, M);               // 아래 두께면
  quad([Bx,By],[Cx,Cy],Co_bc,Bo_bc, D);              // 아래 외곽면

  // CA 빔(오른쪽): 앞면=중간, 외곽=어두움
  quad(Co_ca, Ao_ca, Ai_ca, Ci_ca, M);               // 오른쪽 두께면
  quad([Cx,Cy],[Ax,Ay],Ao_ca,Co_ca, D);              // 오른쪽 외곽면

  // ── 2. 꼭짓점 불가능 연결 (이게 핵심!) ──
  // 상단 꼭짓점 A:
  //   CA빔이 AB빔 앞으로 통과하는 것처럼 보여야 함
  //   → CA빔의 A쪽 끝단면을 AB빔의 Ao/Ai 위에 덮어 그림
  tri(Ao_ca, Ai_ca, [Ax,Ay], L);         // CA 끝 단면(CA의 앞면 색)
  tri(Ao_ca, [Ax,Ay], Ao, M);            // CA→AB 접합 부분

  // 좌하단 꼭짓점 B:
  //   AB빔이 BC빔 아래에서 나오는 것처럼
  //   → BC빔의 B쪽 시작단면을 AB빔의 Bo_ab 위에 덮어 그림
  tri(Bo_bc, Bi_bc, [Bx,By], L);         // BC 시작 단면
  tri([Bx,By], Bo_bc, Bi_ab, M);         // BC→AB 접합

  // 우하단 꼭짓점 C:
  //   BC빔이 CA빔 위에 올라가는 것처럼
  //   → BC빔의 C쪽 끝단면을 CA빔의 Co_ca 위에 덮어 그림
  tri(Co_bc, Ci_bc, [Cx,Cy], M);         // BC 끝 단면
  tri([Cx,Cy], Co_ca, Co_bc, D);         // BC→CA 접합

  // ── 3. 윤곽선 ──
  c.lineWidth=1.3;
  [[Ao,Bo_ab],[Ai,Bi_ab],
   [Bo_bc,Co_bc],[Bi_bc,Ci_bc],
   [Co_ca,Ao_ca],[Ci_ca,Ai_ca]].forEach(function(e){edge(e[0],e[1],E,1.3);});
}
function drawWagonWheel(c,cx,cy,r){
  c.strokeStyle='#a78bfa';c.lineWidth=2;
  c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.stroke();
  c.beginPath();c.arc(cx,cy,r*0.15,0,Math.PI*2);c.stroke();
  var spokes=12;
  for(var i=0;i<spokes;i++){
    var a=i/spokes*Math.PI*2;
    var t=Date.now()*0.001;
    var a2=a+t*2;
    c.strokeStyle='rgba(167,139,250,'+(0.4+0.4*Math.sin(i*0.8))+')';
    c.beginPath();c.moveTo(cx+Math.cos(a2)*r*0.15,cy+Math.sin(a2)*r*0.15);
    c.lineTo(cx+Math.cos(a2)*r*0.95,cy+Math.sin(a2)*r*0.95);c.stroke();
  }
  c.fillStyle='#3a385e';c.font='11px sans-serif';c.textAlign='center';
  c.fillText('어느 방향으로 도나요?',cx,cy+r+18);
  // Animate
  if(!window._wwFrame){window._wwFrame=requestAnimationFrame(function loop(){
    if(document.getElementById('s-puzzle').classList.contains('active')&&
       document.getElementById('pz-vis').querySelector('canvas')){
      c.fillStyle='#080818';c.fillRect(0,0,c.canvas.width,c.canvas.height);
      c.strokeStyle='#a78bfa';c.lineWidth=2;
      c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.stroke();
      c.beginPath();c.arc(cx,cy,r*0.15,0,Math.PI*2);c.stroke();
      var spokes=12;var t2=Date.now()*0.0012;
      for(var i=0;i<spokes;i++){
        var a3=i/spokes*Math.PI*2+t2;
        c.strokeStyle='rgba(167,139,250,'+(0.4+0.4*Math.sin(i*0.8))+')';
        c.beginPath();c.moveTo(cx+Math.cos(a3)*r*0.15,cy+Math.sin(a3)*r*0.15);
        c.lineTo(cx+Math.cos(a3)*r*0.95,cy+Math.sin(a3)*r*0.95);c.stroke();
      }
      c.fillStyle='#3a385e';c.font='11px sans-serif';c.textAlign='center';
      c.fillText('어느 방향으로 도나요?',cx,cy+r+18);
      window._wwFrame=requestAnimationFrame(loop);
    } else {window._wwFrame=null;}
  });}
}
function drawHybridFace(c,cx,cy,r){
  // Low freq: smile (blurred)
  c.save();c.filter='blur(8px)';
  c.strokeStyle='rgba(248,113,113,.8)';c.lineWidth=4;
  c.beginPath();c.arc(cx,cy,r*0.5,0.2,Math.PI-0.2);c.stroke();
  c.beginPath();c.arc(cx-r*0.25,cy-r*0.15,8,0,Math.PI*2);c.fillStyle='rgba(248,113,113,.8)';c.fill();
  c.beginPath();c.arc(cx+r*0.25,cy-r*0.15,8,0,Math.PI*2);c.fill();
  c.restore();
  // High freq: frown (sharp)
  c.strokeStyle='rgba(167,139,250,.9)';c.lineWidth=2;
  c.beginPath();c.arc(cx,cy+r*0.2,r*0.4,Math.PI+0.3,-0.3);c.stroke();
  c.beginPath();c.arc(cx-r*0.25,cy-r*0.1,5,0,Math.PI*2);c.fillStyle='rgba(167,139,250,.9)';c.fill();
  c.beginPath();c.arc(cx+r*0.25,cy-r*0.1,5,0,Math.PI*2);c.fill();
  // Face outline
  c.strokeStyle='rgba(200,196,240,.3)';c.lineWidth=1;
  c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.stroke();
}
function drawAmesRoom(c,W,H){
  // 에임스 방 착시: 사다리꼴 방이 직사각형처럼 보여 크기를 왜곡
  // 핵심: 왼쪽 구석은 실제로 더 멀고 높고, 오른쪽은 가깝고 낮음
  // 하지만 관찰자는 직사각형 방으로 인식해서 오른쪽 사람이 거대해 보임
  c.fillStyle='#0e0c1e';c.fillRect(0,0,W,H);

  // 방의 주요 꼭짓점 (에임스 방 특유의 왜곡)
  // 소실점 (화면 중앙 약간 오른쪽)
  var vpx=W*0.52, vpy=H*0.42;

  // 뒷벽 꼭짓점 (4개) — 사다리꼴
  var bTL=[W*0.20, H*0.12]; // 뒷벽 좌상 (실제로 더 높고 멀다)
  var bTR=[W*0.78, H*0.28]; // 뒷벽 우상
  var bBR=[W*0.78, H*0.82]; // 뒷벽 우하
  var bBL=[W*0.20, H*0.88]; // 뒷벽 좌하 (실제로 더 낮고 멀다)

  // ── 바닥 ──
  var floorGrad=c.createLinearGradient(0,H*0.8,0,H);
  floorGrad.addColorStop(0,'#1e1a3a');floorGrad.addColorStop(1,'#2a2648');
  c.fillStyle=floorGrad;
  c.beginPath();c.moveTo(0,H);c.lineTo(bBL[0],bBL[1]);
  c.lineTo(bBR[0],bBR[1]);c.lineTo(W,H);c.closePath();c.fill();

  // 바닥 타일 격자
  c.strokeStyle='rgba(80,76,140,0.4)';c.lineWidth=1;
  for(var i=1;i<=6;i++){
    var t=i/7;
    // 전→후 방향 선
    var fBotX=t*W, fTopX=bBL[0]+t*(bBR[0]-bBL[0]);
    var fTopY=bBL[1]+t*(bBR[1]-bBL[1]);
    c.beginPath();c.moveTo(fBotX,H);c.lineTo(fTopX,fTopY);c.stroke();
  }
  for(var j=1;j<=4;j++){
    var tj=j/5;
    var lx2=bBL[0]+(0-bBL[0])*0+tj*(bBR[0]-bBL[0])*(W/W);
    c.beginPath();
    c.moveTo(bBL[0]+tj*(bBR[0]-bBL[0]), bBL[1]+tj*(bBR[1]-bBL[1]));
    c.lineTo(tj*W, H); c.stroke();
  }

  // ── 천장 ──
  var ceilGrad=c.createLinearGradient(0,0,0,H*0.3);
  ceilGrad.addColorStop(0,'#0a0818');ceilGrad.addColorStop(1,'#151228');
  c.fillStyle=ceilGrad;
  c.beginPath();c.moveTo(0,0);c.lineTo(bTL[0],bTL[1]);
  c.lineTo(bTR[0],bTR[1]);c.lineTo(W,0);c.closePath();c.fill();

  // ── 뒷벽 ──
  var wallGrad=c.createLinearGradient(bTL[0],0,bTR[0],0);
  wallGrad.addColorStop(0,'#1a1838');wallGrad.addColorStop(0.5,'#22203e');
  wallGrad.addColorStop(1,'#1e1c3c');
  c.fillStyle=wallGrad;
  c.beginPath();c.moveTo(bTL[0],bTL[1]);c.lineTo(bTR[0],bTR[1]);
  c.lineTo(bBR[0],bBR[1]);c.lineTo(bBL[0],bBL[1]);c.closePath();c.fill();

  // 뒷벽 창문 힌트 (원근감 강화)
  c.strokeStyle='rgba(120,116,200,0.25)';c.lineWidth=1;
  for(var wi=1;wi<=3;wi++){
    var wt=wi/4;
    var wx=bTL[0]+wt*(bTR[0]-bTL[0]);
    var wyT=bTL[1]+wt*(bTR[1]-bTL[1]);
    var wyB=bBL[1]+wt*(bBR[1]-bBL[1]);
    c.beginPath();c.moveTo(wx,wyT);c.lineTo(wx,wyB);c.stroke();
  }
  for(var hi=1;hi<=3;hi++){
    var ht=hi/4;
    c.beginPath();
    c.moveTo(bTL[0],bTL[1]+ht*(bBL[1]-bTL[1]));
    c.lineTo(bTR[0],bTR[1]+ht*(bBR[1]-bTR[1]));
    c.stroke();
  }

  // ── 왼쪽 벽 (어두움) ──
  c.fillStyle='#110f22';
  c.beginPath();c.moveTo(0,0);c.lineTo(bTL[0],bTL[1]);
  c.lineTo(bBL[0],bBL[1]);c.lineTo(0,H);c.closePath();c.fill();

  // ── 오른쪽 벽 (약간 밝음) ──
  c.fillStyle='#1c1a34';
  c.beginPath();c.moveTo(W,0);c.lineTo(bTR[0],bTR[1]);
  c.lineTo(bBR[0],bBR[1]);c.lineTo(W,H);c.closePath();c.fill();

  // ──── 인물 A (왼쪽 구석 — 실제로 더 멀고 높음, 작아 보임) ────
  var Apx=bBL[0]+18, Apy=bBL[1];
  var Ah=H*0.36; // 실제 화면 픽셀 키
  function drawPerson(px,py,ph,headCol,bodyCol,lbl){
    // 몸
    var bw=ph*0.22;
    c.fillStyle=bodyCol;
    c.beginPath();
    c.moveTo(px-bw,py);c.lineTo(px+bw,py);
    c.lineTo(px+bw*0.7,py-ph*0.6);c.lineTo(px-bw*0.7,py-ph*0.6);
    c.closePath();c.fill();
    // 목
    c.fillStyle=headCol;
    c.fillRect(px-bw*0.2,py-ph*0.7,bw*0.4,ph*0.12);
    // 머리
    var hr=ph*0.13;
    c.beginPath();c.arc(px,py-ph*0.7-hr,hr,0,Math.PI*2);
    c.fillStyle=headCol;c.fill();
    // 눈
    c.fillStyle='rgba(10,8,30,0.8)';
    c.beginPath();c.arc(px-hr*0.35,py-ph*0.7-hr*1.1,hr*0.18,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(px+hr*0.35,py-ph*0.7-hr*1.1,hr*0.18,0,Math.PI*2);c.fill();
    // 라벨
    c.fillStyle=headCol;c.font='bold 11px monospace';c.textAlign='center';
    c.fillText(lbl,px,py+14);
  }

  drawPerson(Apx, Apy, Ah, '#c4b5fd','#7c3aed','A');

  // ──── 인물 B (오른쪽 구석 — 가깝고 낮음, 거대해 보임) ────
  // 실제 화면 픽셀 키는 A와 동일하지만 방이 더 낮아 보여 거대해 보임
  var Bpx=bBR[0]-18, Bpy=bBR[1];
  var Bh=H*0.36; // 동일한 픽셀 키!

  drawPerson(Bpx, Bpy, Bh, '#f9a8d4','#ec4899','B');

  // 설명
  c.fillStyle='rgba(90,88,112,0.75)';c.font='10px sans-serif';c.textAlign='center';
  c.fillText('A와 B의 실제 키는 같습니다',W/2,H-4);
}
function drawInvertedFace(c,cx,cy,r){
  // 뒤집힌 얼굴 착시 (Margaret Thatcher effect)
  // 얼굴 전체를 거꾸로 그리되, 눈과 입만 정방향으로 배치
  // → 거꾸로 볼 때는 자연스러워 보이지만, 바로 세우면 기괴함
  c.save();
  // 전체 캔버스를 cx,cy 중심으로 180도 회전 (얼굴 전체 뒤집기)
  c.translate(cx, cy);
  c.rotate(Math.PI);
  c.translate(-cx, -cy);

  // 얼굴 윤곽 (뒤집혀 있음)
  c.strokeStyle='rgba(200,196,240,0.7)';c.lineWidth=2;
  c.beginPath();c.ellipse(cx,cy,r*0.62,r*0.82,0,0,Math.PI*2);c.stroke();
  // 피부 fill
  c.fillStyle='rgba(30,25,60,0.6)';c.fill();

  // 머리카락 (위쪽)
  c.fillStyle='#2d2050';
  c.beginPath();c.ellipse(cx,cy-r*0.72,r*0.65,r*0.28,0,Math.PI,0);c.fill();

  // 코
  c.strokeStyle='rgba(167,139,250,0.6)';c.lineWidth=1.5;
  c.beginPath();
  c.moveTo(cx-r*0.08,cy-r*0.12);
  c.lineTo(cx-r*0.14,cy+r*0.15);
  c.lineTo(cx+r*0.14,cy+r*0.15);
  c.lineTo(cx+r*0.08,cy-r*0.12);
  c.stroke();

  // 이제 눈과 입을 정방향으로 (거꾸로 뒤집어 놓기 = 다시 rotate -PI)
  c.save();
  c.translate(cx,cy);c.rotate(-Math.PI);c.translate(-cx,-cy);

  // 눈 (정방향으로 배치 — 원래 위치)
  // 눈 흰자
  c.fillStyle='#e8e4ff';
  c.beginPath();c.ellipse(cx-r*0.26,cy-r*0.18,r*0.16,r*0.10,0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(cx+r*0.26,cy-r*0.18,r*0.16,r*0.10,0,0,Math.PI*2);c.fill();
  // 눈동자
  c.fillStyle='#1a1040';
  c.beginPath();c.arc(cx-r*0.26,cy-r*0.18,r*0.07,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(cx+r*0.26,cy-r*0.18,r*0.07,0,Math.PI*2);c.fill();
  // 눈썹 (정방향)
  c.strokeStyle='#a78bfa';c.lineWidth=2;
  c.beginPath();c.moveTo(cx-r*0.38,cy-r*0.30);c.quadraticCurveTo(cx-r*0.26,cy-r*0.34,cx-r*0.14,cy-r*0.30);c.stroke();
  c.beginPath();c.moveTo(cx+r*0.14,cy-r*0.30);c.quadraticCurveTo(cx+r*0.26,cy-r*0.34,cx+r*0.38,cy-r*0.30);c.stroke();

  // 입 (정방향 — 활짝 웃는 모양)
  c.strokeStyle='#f472b6';c.lineWidth=2.5;
  c.beginPath();c.arc(cx,cy+r*0.22,r*0.25,0.15,Math.PI-0.15);c.stroke();
  // 입술 라인
  c.beginPath();c.moveTo(cx-r*0.25,cy+r*0.22);c.lineTo(cx+r*0.25,cy+r*0.22);
  c.strokeStyle='rgba(244,114,182,0.4)';c.lineWidth=1;c.stroke();
  c.restore(); // 눈/입 정방향 복원

  c.restore(); // 전체 뒤집기 복원

  // 라벨
  c.fillStyle='rgba(90,88,112,0.8)';c.font='10px sans-serif';c.textAlign='center';
  c.fillText('↓ 거꾸로 뒤집으면? ↓',cx,cy+r+16);
}
function drawImpossibleMotion(c,W,H){
  // Two balls that appear to pass through each other
  var t=Date.now()*0.001;
  var y=H/2;
  var x1=(W*0.5+Math.cos(t)*W*0.35);
  var x2=(W*0.5-Math.cos(t)*W*0.35);
  // bar
  c.fillStyle='#2a2848';c.fillRect(W*0.5-4,H*0.2,8,H*0.6);
  // balls
  c.beginPath();c.arc(x1,y,20,0,Math.PI*2);
  var g1=c.createRadialGradient(x1-5,y-5,2,x1,y,20);
  g1.addColorStop(0,'#c8c4f0');g1.addColorStop(1,'#8b7cf8');
  c.fillStyle=g1;c.fill();
  c.beginPath();c.arc(x2,y,20,0,Math.PI*2);
  var g2=c.createRadialGradient(x2-5,y-5,2,x2,y,20);
  g2.addColorStop(0,'#fcd0e0');g2.addColorStop(1,'#e07ca0');
  c.fillStyle=g2;c.fill();
  c.fillStyle='#3a385e';c.font='11px sans-serif';c.textAlign='center';
  // Animate
  if(!window._imFrame){window._imFrame=requestAnimationFrame(function loop(){
    if(document.getElementById('s-puzzle').classList.contains('active')&&
       document.getElementById('pz-vis').querySelector('canvas')){
      c.fillStyle='#080818';c.fillRect(0,0,W,H);
      var t2=Date.now()*0.001;var y2=H/2;
      var nx1=(W*0.5+Math.cos(t2)*W*0.35);var nx2=(W*0.5-Math.cos(t2)*W*0.35);
      c.fillStyle='#2a2848';c.fillRect(W*0.5-4,H*0.2,8,H*0.6);
      c.beginPath();c.arc(nx1,y2,20,0,Math.PI*2);
      var ng1=c.createRadialGradient(nx1-5,y2-5,2,nx1,y2,20);
      ng1.addColorStop(0,'#c8c4f0');ng1.addColorStop(1,'#8b7cf8');c.fillStyle=ng1;c.fill();
      c.beginPath();c.arc(nx2,y2,20,0,Math.PI*2);
      var ng2=c.createRadialGradient(nx2-5,y2-5,2,nx2,y2,20);
      ng2.addColorStop(0,'#fcd0e0');ng2.addColorStop(1,'#e07ca0');c.fillStyle=ng2;c.fill();
      c.fillStyle='#3a385e';c.font='11px sans-serif';c.textAlign='center';
      c.fillText('각 공의 궤적을 따로 추적해보세요',W/2,H-8);
      window._imFrame=requestAnimationFrame(loop);
    } else {window._imFrame=null;}
  });}
}

function startPuzzle(){
  window._wwFrame=null;window._imFrame=null;
  clearInterval(timerInt);puzzleDone=false;
  var day=DAYS[dayIdx];var pat=day.patients[patientIdx];var pz=pat.puzzle;
  document.getElementById('pz-badge').textContent=pat.badge+' · 착시 검사';
  document.getElementById('pz-title').textContent=pz.title;
  document.getElementById('pz-diff').textContent='난이도 '+pz.diff+'/7';
  document.getElementById('pz-desc').textContent=pz.desc;
  document.getElementById('pz-q').textContent=pz.q;
  document.getElementById('pz-fb').textContent='';document.getElementById('pz-fb').className='';
  document.getElementById('hint-txt').style.display='none';
  document.getElementById('hint-txt').textContent=pz.hint;
  renderPuzzleVis(pz);
  var wrap=document.getElementById('pz-btns');wrap.innerHTML='';
  pz.choices.forEach(function(ch2){

function answerPuzzle(choice,btn){
  if(puzzleDone)return;puzzleDone=true;clearInterval(timerInt);
  var pat=DAYS[dayIdx].patients[patientIdx];var pz=pat.puzzle;
  var ok=choice===pz.correct;
  var fb=document.getElementById('pz-fb');
  if(ok){btn.classList.add('ok2');fb.textContent='✅ '+pz.okTx;fb.className='ok';}
  else{
    btn.classList.add('ng');fb.textContent='❌ '+pz.ngTx;fb.className='no';
    loseSanity(8);wrongTotal++;whiteFlash();
    document.querySelectorAll('.cb').forEach(function(b){if(b.textContent===pz.correct)b.classList.add('ok2');});
  }
  document.querySelectorAll('.cb').forEach(function(b){b.disabled=true;});
  setTimeout(function(){dIdx=0;dMode='post';show('s-dialog');renderDialog();},2200);
}
function toggleHint(){
  var h=document.getElementById('hint-txt');
  h.style.display=h.style.display==='none'?'block':'none';
  loseSanity(5);
}

function startTimer(sec){
  timeLeft=sec;var bar=document.getElementById('timer-fill');
  bar.style.width='100%';bar.style.background='var(--acc)';
  clearInterval(timerInt);
  timerInt=setInterval(function(){
    timeLeft-=0.1;var pct=Math.max(0,timeLeft/sec*100);
    bar.style.width=pct+'%';
    if(pct<30)bar.style.background='#f87171';
    else if(pct<60)bar.style.background='#fbbf24';
    if(timeLeft<=0){clearInterval(timerInt);if(!puzzleDone)timeUp();}
  },100);
}

function timeUp(){
  puzzleDone=true;var pat=DAYS[dayIdx].patients[patientIdx];var pz=pat.puzzle;
  document.getElementById('pz-fb').textContent='⏰ '+pz.ngTx;
  document.getElementById('pz-fb').className='no';
  loseSanity(12);wrongTotal++;whiteFlash();
  document.querySelectorAll('.cb').forEach(function(b){b.disabled=true;if(b.textContent===pz.correct)b.classList.add('ok2');});
  setTimeout(function(){dIdx=0;dMode='post';show('s-dialog');renderDialog();},2200);
}

var prevEnding = null; // 'deny' | 'accept' | 'collapse' | null


// ── 엔딩 자동 계산 ──
function calcEnding(){
  var score=endScore*2+(sanity-50)/10-wrongTotal;
  var key;
  // 엔딩 분기: score, 정신력, 오답 조합
  if(score>=6&&sanity>=75){
    // 모든 엔딩 해금 시 특수 엔딩 가능
    var allKeys=['deny_firm','deny_doubt','accept_wake','accept_peace','collapse_lost','collapse_wife','collapse_deep','truth','perfect'];
    var unlocked=saveData.unlockedEndings||[];
    var allNormalUnlocked=['deny_firm','deny_doubt','accept_wake','accept_peace','collapse_lost','collapse_wife','collapse_deep'].every(function(k){return unlocked.indexOf(k)>=0;});
    if(allNormalUnlocked){key='perfect';}
    else{key='deny_firm';}
  } else if(score>=4&&sanity>=60){
    key='deny_firm';
  } else if(score>=2&&sanity>=50){
    key='deny_doubt';
  } else if(score>=1&&wrongTotal<=2&&sanity>=50){
    // 진실 엔딩: 균형 잡힌 플레이 + 정신력 보통 + 오답 적음
    var unlocked2=saveData.unlockedEndings||[];
    var hasWake=unlocked2.indexOf('accept_wake')>=0;
    if(hasWake){key='truth';}else{key='accept_wake';}
  } else if(score>=-1&&sanity>=40){
    key='accept_wake';
  } else if(score>=-2&&sanity>=30){
    key='accept_peace';
  } else if(score<=-2&&sanity<30){
    key='collapse_deep';
  } else if(score<=-3&&wrongTotal>=4){
    key='collapse_wife';
  } else {
    key='collapse_lost';
  }
  clearProgress();
  unlockEnding(key);
  var trans=document.getElementById('day-trans');
  trans.style.display='block';trans.style.transition='opacity .5s';trans.style.opacity='1';
  setTimeout(function(){
    showEnding(key,false);
    setTimeout(function(){
      trans.style.opacity='0';
      setTimeout(function(){trans.style.display='none';},500);
    },300);
  },600);
}

function showEnding(key,fromGallery){
  var e=ENDINGS[key]||ENDINGS.deny;
  document.getElementById('e-tag').textContent=e.tag;
  document.getElementById('e-art').innerHTML=e.art;
  document.getElementById('e-title').textContent=e.title;
  document.getElementById('e-body').style.borderColor=e.color;
  document.getElementById('e-body').innerHTML=e.body.replace(/\n/g,'<br>');
  var summaryEl=document.getElementById('e-summary');
  if(!fromGallery){
    var advLog=window._adviceLog||[];
    var denyCnt=0,collapseCnt=0,acceptCnt=0;
    advLog.forEach(function(k){if(k==='deny')denyCnt++;else if(k==='collapse')collapseCnt++;else acceptCnt++;});
    var sanityLabel=sanity>=70?'안정적':sanity>=40?'흔들림':'붕괴 직전';
    summaryEl.innerHTML='<div style="margin-top:16px;padding:14px 16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;font-size:.72rem;color:#3a385e;line-height:2;text-align:left;max-width:430px;">'+
      '<div style="color:#5a5870;letter-spacing:2px;font-size:.6rem;margin-bottom:8px;">— 이번 회차 기록 —</div>'+
      '<div>정신력 최종: <span style="color:'+e.color+'">'+sanity+'%</span> ('+sanityLabel+')</div>'+
      '<div>오답 횟수: <span style="color:'+(wrongTotal>=4?'#f87171':'#6a6890')+'">'+wrongTotal+'회</span></div>'+
      (advLog.length?'<div>조언 성향: <span style="color:#8b7cf8">현실 고수 '+denyCnt+'</span> / <span style="color:#34d399">중립 '+acceptCnt+'</span> / <span style="color:#f87171">균열 '+collapseCnt+'</span></div>':'')+
      '<div style="margin-top:6px;color:#2a2850;font-size:.65rem;">이 엔딩은 당신의 선택이 만들었습니다.</div></div>';
  } else {
    summaryEl.innerHTML='';
  }
  show('s-end');
}

var _cutIdx=0;
function playCutscene(){
  _cutIdx=0;
  // 전체 화면 어둡게
  var ov=document.getElementById('cut-overlay');
  if(!ov){
    ov=document.createElement('div');ov.id='cut-overlay';

    ov.appendChild(box);

    ov.addEventListener('click',nextCut);
  }

function renderCut(){
  if(_cutIdx>=_cutLines.length){
    var ov=document.getElementById('cut-overlay');
    if(ov)ov.style.display='none';
    // perfect 엔딩 해금
    unlockEnding('perfect');
    show('s-gallery');
    return;
  }
  var line=_cutLines[_cutIdx];
  var spEl=document.getElementById('cut-sp');
  var txEl=document.getElementById('cut-tx');
  if(spEl)spEl.textContent=line.sp.toUpperCase();
  if(txEl){
    txEl.textContent='';
    var i=0;var txt=line.tx;
    clearInterval(window._cutType);
    window._cutType=setInterval(function(){
      if(i<txt.length){txEl.textContent+=txt[i];i++;}
      else clearInterval(window._cutType);
    },25);
  }
}
function nextCut(){
  if(window._cutType){
    clearInterval(window._cutType);
    var line=_cutLines[_cutIdx];
    var txEl=document.getElementById('cut-tx');
    if(txEl)txEl.textContent=line.tx;
    window._cutType=null;return;
  }
  _cutIdx++;renderCut();
}
